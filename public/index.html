        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Para un departamento típico de 55 m² en Santiago (~4.235 UF, ~$163 millones), necesitas un sueldo líquido de al menos $1.400.000 mensuales para que el dividendo no supere el 30% de tu ingreso. Con subsidios DS1 o DS49, ese umbral puede bajar significativamente."

        "@type": "Question",
        "name": "¿Cuánto es el pie mínimo para una hipoteca en Chile?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Por ley (desde 2015) el pie mínimo es el 20% del precio de la vivienda. Con FOGAES (Fondo de Garantía Especial) puedes reducirlo al 10% si la vivienda cuesta hasta 4.500 UF. La Ley 21.748 también facilita el acceso para viviendas nuevas bajo 4.000 UF."
        }
      },

        "@type": "Question",
        "name": "¿Qué banco tiene la tasa hipotecaria más baja en Chile 2026?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Según datos CMF de marzo 2026, Banco Itaú ofrece la tasa fija más baja del mercado (3,39%), seguido de Banco Falabella (3,70%). El promedio del mercado es 4,35%. El banco con el dividendo absoluto más bajo registrado por la CMF es Banco Internacional ($892.377 / 22,40 UF para un crédito estándar)."

        "@type": "Question",
        "name": "¿Cuáles son los subsidios habitacionales disponibles en Chile 2026?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Los principales subsidios MINVU 2026 son: DS49 (sectores vulnerables, hasta 314 UF de subsidio), DS1 Tramos 1/2/3 (sectores medios, hasta 130 UF), FOGAES (pie reducido al 10%), Ley 21.748 (descuento en tasa para vivienda nueva), DS52 (arriendo), DS19 (integración social), DS27 (construcción en sitio propio) y programas de mejoramiento de vivienda."
        }
      },
      {
        "@type": "Question",
        "name": "¿Conviene más arrendar o comprar casa en Chile?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Depende del precio de la vivienda y el arriendo de mercado. Si el dividendo mensual es menor que el arriendo equivalente, comprar suele convenir. Además, parte del dividendo genera patrimonio (amortización del crédito). La calculadora compara ambas opciones con tu situación real y estima el punto de equilibrio."
        }
      }
    ]
  }
