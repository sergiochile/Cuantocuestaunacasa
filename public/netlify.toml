# ============================================================
# netlify.toml — ¿Cuánto cuesta una casa en Chile?
# cuantocuestaunacasa.cl
# ============================================================

[build]
  publish = "."

# ── Redirecciones ────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Cabeceras de caché y seguridad ───────────────────────────

# HTML — sin caché (siempre fresco)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control            = "public, max-age=0, must-revalidate"
    X-Frame-Options          = "DENY"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy  = "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://partner.googleadservices.com https://tpc.googlesyndication.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://mindicador.cl https://pagead2.googlesyndication.com; img-src 'self' data: https:;"

# CSS y JS — caché agresivo 1 año (nombres con hash en prod, ok para SPA)
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imágenes
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Optimización de assets ────────────────────────────────────
# Netlify aplica gzip/brotli automáticamente en el CDN.
# La compresión de imágenes se activa aquí:
[build.processing]
  skip_processing = false

[build.processing.images]
  compress = true
